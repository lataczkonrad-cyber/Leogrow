# Netlify reads this file. The website is the ready-built "site" folder; no build step needed.
[build]
  publish = "site"

[[redirects]]
  from = "/"
  to = "/lingrow-academy.html"
  status = 200

# the tester version (Netlify matches "/tester" and "/tester/" alike; never add a /tester/ -> /tester redirect, it loops)
[[redirects]]
  from = "/tester"
  to = "/lingrow-academy.html"
  status = 200

[[redirects]]
  from = "/tester/*"
  to = "/:splat"
  status = 200

# Premium payments (Stripe): small server functions in netlify/functions
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
